<!DOCTYPE html>
<html>
  <head>
    <title>Chat</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='estilo_chat.css') }}"
    />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  </head>
  <body>
    <div id="containerChat">
      <h1 id="tituloSala">{{ sala }}</h1>
      <ul id="mensagens"></ul>
    
      <div id="inputContainer">
        <input
          id="mensagemInput"
          type="text"
          placeholder="Digite sua mensagem"
        />
        <input id="arquivoInput" type="file" />
        <button id="enviarBtn">Enviar</button>
      </div>
    
      <button id="sairBtn">Sair</button>
    </div>
    
    <script>
      const socket = io();
      const sala = "{{ sala }}";
      const nome_usuario = "{{ nome }}";
    
      socket.emit("entrar_sala", {
        nome_sala: sala,
        nome_usuario: nome_usuario,
      });
    
      document.getElementById("enviarBtn").addEventListener("click", function () {
        const mensagem = document.getElementById("mensagemInput").value;
        const arquivoInput = document.getElementById("arquivoInput");
    
        if (arquivoInput.files.length > 0) {
          const arquivo = arquivoInput.files[0];
          const reader = new FileReader();
    
          reader.onload = function (event) {
            socket.emit("enviar_arquivo", {
              nome_sala: sala,
              nome_usuario: nome_usuario,
              arquivo: event.target.result,
              nome_arquivo: arquivo.name,
            });
          };
    
          reader.readAsDataURL(arquivo);
          arquivoInput.value = ""; 
        } else if (mensagem.trim() !== "") {
          socket.emit("enviar_mensagem", {
            nome_sala: sala,
            texto: mensagem,
          });
          document.getElementById("mensagemInput").value = ""; 
        }
      });
    
      document.getElementById("mensagemInput").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("enviarBtn").click();
        }
      });
    
      socket.on("nova_mensagem", function (data) {
        const listaMensagens = document.getElementById("mensagens");
        const novaMensagem = document.createElement("li");
    
        if (data.file_url) {
          const link = document.createElement("a");
          link.href = data.file_url;
          link.target = "_blank";
          link.textContent = data.texto; // Nome do arquivo ou mensagem
          novaMensagem.appendChild(link);
        } else {
          novaMensagem.textContent = data.texto;
        }
    
        listaMensagens.appendChild(novaMensagem);
      });
    
      function sairSala() {
        socket.emit("sair_sala", {
          nome_sala: sala,
          nome_usuario: nome_usuario,
        });
        window.location.href = "/inicio";
      }
    
      document.getElementById("sairBtn").addEventListener("click", sairSala);
    </script>
  </body>
</html>
