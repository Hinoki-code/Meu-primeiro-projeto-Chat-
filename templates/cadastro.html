<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Cadastro</h1>
    </header>

    <main>
        <form action="{{ url_for('registrar') }}" method="post">
            <h3>Seus dados</h3>
            
            <label for="nickname">Seu Nickname:</label>
            <input type="text" id="nickname" name="nickname" required autocomplete="off">
            
            <label for="mail">E-mail:</label>
            <input type="email" id="mail" name="mail" required autocomplete="off">
            
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required autocomplete="off">

            <label for="num">Número:</label>
            <input type="tel" id="num" name="num" required autocomplete="off">
            
            <button type="submit">Criar Conta</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Chat Papo. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
